<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nadir</title>
    <meta name="description" content="Jogo de gestão de recursos de uma colônia submarina." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Stencil+One&family=Special+Elite&display=swap" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">Nadir</span>
          <span class="brand-sub">Colônia submarina</span>
        </div>
        <div class="topbar-meta" id="meta"></div>
        <div class="topbar-actions">
          <button type="button" class="ghost small" data-action="help" data-key="help">Como jogar</button>
          <button type="button" class="ghost small" data-action="new-game" data-key="new-game">Nova colônia</button>
        </div>
      </header>
      <section class="hud" id="hud" aria-label="Instrumentos da colônia"></section>
      <main class="layout">
        <section class="colony" aria-label="Corte da colônia">
          <div class="crewbar" id="crewbar"></div>
          <div class="sea">
            <canvas class="snow" id="snow" aria-hidden="true"></canvas>
            <div class="sea-content" id="levels"></div>
          </div>
        </section>
        <aside class="panel" id="panel" aria-label="Painel do Conselho"></aside>
      </main>
      <footer class="actionbar" id="actionbar"></footer>
      <div id="modal-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
