<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nadir</title>
    <meta name="description" content="Jogo em terceira pessoa numa colônia submarina, com moradores que têm nome, rotina, família e memória." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Stencil+One&family=Special+Elite&display=swap" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
  </head>
  <body>
    <div id="app" class="app in-menu">
      <canvas id="view" aria-label="Vista da colônia"></canvas>
      <div id="world-ui" class="world-ui" aria-hidden="true"></div>
      <div id="hud" class="hud"></div>
      <div id="prompt" class="prompt" hidden></div>
      <div id="touch" class="touch" aria-hidden="true">
        <div class="look" data-look></div>
        <div class="stick" data-stick><div class="knob" data-knob></div></div>
        <div class="touch-buttons">
          <button type="button" class="tb tb-use" data-press="e">Usar</button>
          <button type="button" class="tb" data-press=" ">Nadar</button>
          <button type="button" class="tb" data-press="t">Esperar</button>
        </div>
      </div>
      <div id="panel" class="panel"></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <div id="fade" class="fade"></div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
